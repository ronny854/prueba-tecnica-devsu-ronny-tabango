apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: myapp
  labels:
    app: demo-devops-python
    component: config
data:
  # Django settings (non-sensitive)
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,demo-devops-python.local,*"
  DATABASE_NAME: "db.sqlite3"
  PORT: "8000"
  
  # Python settings
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  
  # Gunicorn settings
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"
  GUNICORN_TIMEOUT: "120"
  GUNICORN_LOGLEVEL: "info"