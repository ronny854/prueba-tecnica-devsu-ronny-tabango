apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-devops-python-ingress
  namespace: myapp
  labels:
    app: demo-devops-python
    component: ingress
  annotations:
    # Anotaciones para NGINX Ingress Controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    
    # Rate limiting (opcional)
    # nginx.ingress.kubernetes.io/limit-rps: "10"
    
    # CORS (opcional)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    
    # Configuración de certificados (para producción con cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx  # Cambiar según tu ingress controller
  
  # TLS configuration (descomentar en producción con cert-manager)
  # tls:
  # - hosts:
  #   - prueba.devsu.demopython.ronnytabango.com
  #   secretName: demo-devops-python-tls
  
  rules:
  - host: prueba.devsu.demopython.ronnytabango.com  # Cambiar por tu dominio real
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo-devops-python-clusterip
            port:
              number: 80
  
  # Regla alternativa sin host (para acceso por IP)
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo-devops-python-clusterip
            port:
              number: 80