# Stage para validar acceso a minikube y Docker
stages:
  - stage: DeployAppMinikube
    displayName: "Desplegar aplicación en Minikube"
    dependsOn: [Build]
    jobs:
      - job: CheckMinikubeAndDocker
        displayName: "Verificar kubectl y docker"
        pool:
          name: minikube-agents
        variables:
        - name: IMAGE_FULL_TAG
          value: $[stageDependencies.Build.DockerBuildPush.outputs['PushImageStep.IMAGE_FULL_TAG']]
        steps:
          - script: |
              set -euo pipefail
              echo "==================================="
              echo "  Validación de Minikube y Docker"
              echo "==================================="

              DIR_SSH="$HOME/.ssh/azure-agent-key"
              chmod 600 $DIR_SSH

              echo "🔍 Verificando conectividad con servidor Minikube..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "echo '✅ Conexión SSH exitosa'"

              echo ""
              echo "🐳 Verificando Docker..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "docker --version"
              ssh -i $DIR_SSH ronny@10.0.2.3 "docker ps --format 'table {{.Names}}\t{{.Status}}'"

              echo ""
              echo "☸️  Verificando Kubernetes..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl version --client"
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl get nodes"
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl get pods -A"
              # kubectl create deployment web --image=gcr.io/google-samples/hello-app:1.0
              # kubectl expose deployment web --type=NodePort --port=8080
              # kubectl get services web
              # minikube service web --url

              echo "==================================="
              echo "  ✅ Validación completada"
              echo "==================================="
            displayName: "🔍 Validar acceso a Minikube y Docker"
          - script: |
              set -euo pipefail
              echo "==================================="
              echo "  Despliegue en Kubernetes"
              echo "==================================="

              # Verificar que la variable de imagen esté definida
              if [ -z "$ENV_IMAGE_FULL_TAG" ]; then
                echo "❌ ERROR: La variable ENV_IMAGE_FULL_TAG no está definida."
                exit 1
              fi

              echo "✅ Imagen a desplegar: $ENV_IMAGE_FULL_TAG"

              # Verificar que el directorio k8s existe
              if [ ! -d "k8s" ]; then
                echo "❌ ERROR: El directorio k8s no existe."
                exit 1
              fi

              echo "✅ Directorio k8s encontrado"
              ls -la k8s/

              # Preparar SSH
              DIR_SSH="$HOME/.ssh/azure-agent-key"
              chmod 600 $DIR_SSH

              # Copiar manifiestos al servidor
              echo "📦 Copiando manifiestos k8s al servidor Minikube..."
              scp -i $DIR_SSH -r k8s ronny@10.0.2.3:$HOME/

              # echo "🚀 Iniciando despliegue en Kubernetes..."

              # # Aplicar namespace primero
              echo "1️⃣  Aplicando namespace..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl apply -f $HOME/k8s/namespace.yaml"

              # Aplicar ConfigMap y Secret
              echo "2️⃣  Aplicando ConfigMap y Secret..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl apply -f $HOME/k8s/configmap.yaml -n myapp"
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl apply -f $HOME/k8s/secret.yaml -n myapp"

              # Aplicar Service
              echo "3️⃣  Aplicando Service..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl apply -f $HOME/k8s/service.yaml -n myapp"

              # Aplicar Deployment con la imagen correcta
              echo "4️⃣  Aplicando Deployment..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl apply -f $HOME/k8s/deployment.yaml -n myapp"

              # Actualizar la imagen del deployment
              echo "5️⃣  Actualizando imagen del deployment a: $ENV_IMAGE_FULL_TAG"
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl set image deployment/demo-devops-python demo-devops-python=$ENV_IMAGE_FULL_TAG -n myapp"

              # Aplicar HPA
              echo "6️⃣  Aplicando HPA..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl apply -f $HOME/k8s/hpa.yaml -n myapp"

              # Aplicar Ingress
              echo "7️⃣  Aplicando Ingress..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl apply -f $HOME/k8s/ingress.yaml -n myapp"

              # Esperar a que el rollout termine
              echo "⏳ Esperando a que el deployment esté listo..."
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl rollout status deployment/demo-devops-python -n myapp --timeout=5m"

              # Mostrar estado final
              echo "📊 Estado final del despliegue:"
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl get pods -n myapp -o wide"
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl get svc -n myapp"
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl get ingress -n myapp"

              echo "==================================="
              echo "  ✅ Despliegue completado"
              echo "==================================="
            displayName: "🚀 Desplegar en Minikube"
            env:
              ENV_IMAGE_FULL_TAG: $(IMAGE_FULL_TAG)