# Stage para validar acceso a minikube y Docker
stages:
  - stage: ValidateMinikubeAndDocker
    displayName: "Validar acceso a Minikube y Docker"
    dependsOn: [Build]
    jobs:
      - job: CheckMinikubeAndDocker
        displayName: "Verificar kubectl y docker"
        pool:
          name: minikube-agents
        variables:
        - name: IMAGE_FULL_TAG
          value: $[stageDependencies.Build.BuildAndTest.outputs['PushImageStep.IMAGE_FULL_TAG']]
        steps:
          - script: |
              DIR_SSH="$HOME/.ssh/azure-agent-key"
              echo "== Preparando SSH =="
              chmod 600 $DIR_SSH
              echo "Verificando pods en todos en el servidor Minikube:"
              ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl get pods -A"
              echo "\nVerificando contenedores Docker:"
              ssh -i $DIR_SSH ronny@10.0.2.3 "docker ps"
            displayName: "kubectl get pods y docker ps"
          - script: |
              echo "$(IMAGE_FULL_TAG)"
              echo "$ENV_IMAGE_FULL_TAG"
              ls
              if [ -z "$ENV_IMAGE_FULL_TAG" ]; then
                echo "ERROR: La variable ENV_IMAGE_FULL_TAG no está definida."
                exit 1
              elif [ -d "k8s" ]; then
                echo "La variable ENV_IMAGE_FULL_TAG está definida correctamente."
                echo "El directorio k8s existe. Copiando al servidor..."
                DIR_SSH="$HOME/.ssh/azure-agent-key"
                scp -i $DIR_SSH -r k8s ronny@10.0.2.3:/tmp/
                echo "== Preparando SSH para despliegue =="
                chmod 600 $DIR_SSH
                echo "Desplegando imagen: $ENV_IMAGE_FULL_TAG"
              
                ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl set image /tmp/k8s/deployment/myapp myapp=$ENV_IMAGE_FULL_TAG -n default"
                ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl rollout status /tmp/k8s/deployment/myapp -n default"
                ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl get pods -o wide -n default"
              else
                echo "El directorio k8s no existe. No se realiza despliegue."
                exit 1
              fi
            displayName: "Desplegar nueva imagen en Kubernetes"
            env:
              ENV_IMAGE_FULL_TAG: $(IMAGE_FULL_TAG)