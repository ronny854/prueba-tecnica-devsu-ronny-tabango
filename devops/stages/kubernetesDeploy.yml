# Stage para validar acceso a minikube y Docker
stages:
- stage: ValidateMinikubeAndDocker
  displayName: "Validar acceso a Minikube y Docker"
  dependsOn: [build]
  jobs:
  - job: CheckMinikubeAndDocker
    displayName: "Verificar kubectl y docker"
    pool:
      name: minikube-agents
    steps:
      - script: |
          DIR_SSH="$HOME/.ssh/azure-agent-key"
          echo "== Preparando SSH =="
          chmod 600 $DIR_SSH
          echo "Verificando pods en todos en el servidor Minikube:"
          ssh -i $DIR_SSH ronny@10.0.2.3 "kubectl get pods -A"
          echo "\nVerificando contenedores Docker:"
          ssh -i $DIR_SSH ronny@10.0.2.3 "docker ps"
        displayName: "kubectl get pods y docker ps"
