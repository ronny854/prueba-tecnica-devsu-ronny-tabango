parameters:
  - name: projectname
  - name: imageRepository
  - name: tag
  - name: dockerfilePath
  # ==========================================
  # PARÁMETROS SONARCLOUD/SONARQUBE
  # ==========================================
  - name: runSonarAnalysis
  - name: sonarProjectName
  - name: sonarOrganization

stages:
  - stage: CI
    displayName: 'CI'
    dependsOn: []
    variables:
      - group: MINIKUBE-VARS
      - name: workingDirectory
        value: '$(Build.SourcesDirectory)/${{ parameters.projectname }}'
      - name: buildImage
        value: 'ronnyt854/python311_build:v1.1'
      - name: containerRegistry
        value: 'docker.io'
      # - name: dockerRegistryServiceConnection
      #   value: 'dockerRegistryServiceConnection'
      # - name: sonarServiceConnection
      #   value: 'conection-sonarqube-github-account'

    jobs:
      - template: ../jobs/jobBuildPython.yml
        parameters:
          workingDirectory: $(workingDirectory)
          buildImage: $(buildImage)

      - ${{ if eq(parameters.runSonarAnalysis, true) }}:
        - template: ../jobs/jobSonarQubeAnalisys.yml
          parameters:
            workingDirectory: $(workingDirectory)
            # sonarServiceConnection: $(sonarServiceConnection)
            sonarProjectName: ${{ parameters.sonarProjectName }}
            sonarOrganization: ${{ parameters.sonarOrganization }}

      - template: ../jobs/jobDockerBuildPush.yml
        parameters:
          workingDirectory: $(workingDirectory)
          dockerfilePath: ${{ parameters.dockerfilePath }}
          imageRepository: ${{ parameters.imageRepository }}
          tag: ${{ parameters.tag }}
          containerRegistry: $(containerRegistry)
          # dockerRegistryServiceConnection: $(dockerRegistryServiceConnection)
          runSonarAnalysis: ${{ parameters.runSonarAnalysis }}