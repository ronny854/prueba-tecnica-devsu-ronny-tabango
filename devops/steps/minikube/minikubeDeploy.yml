steps:
- script: |
    set -euo pipefail
    SSH_KEY="$HOME/.ssh/azure-agent-key"
    chmod 600 $SSH_KEY
    if [ -z "${IMAGE_FULL_TAG:-}" ]; then
      echo "❌ IMAGE_FULL_TAG no definida"
      exit 1
    fi
    echo "🖼️ Imagen: $IMAGE_FULL_TAG"
    echo "🔁 Inyectando imagen en deployment.yaml"
    sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_FULL_TAG|g" k8s/deployment.yaml
    echo "🔁 Inyectando DJANGO_SECRET_KEY en secret.yaml"
    sed -i "s|DJANGO_SECRET_KEY_PLACEHOLDER|$DJANGO_SECRET_KEY|g" k8s/secret.yaml
    echo "📦 Sincronizando k8s/"
    rsync -avz -e "ssh -i $SSH_KEY" k8s/ $VM_USER@$VM_IP:$HOME/k8s/
    echo "🚀 Ejecutando despliegue remoto..."
    ssh -i $SSH_KEY $VM_USER@$VM_IP "chmod 600 $HOME/k8s/deploy.sh"
    ssh -i $SSH_KEY $VM_USER@$VM_IP "bash $HOME/k8s/deploy.sh"
  displayName: "Deploy App in Minikube"
  env:
    IMAGE_FULL_TAG: $(IMAGE_FULL_TAG)
    DJANGO_SECRET_KEY: $(DJANGO_SECRET_KEY)
    VM_USER: $(VM_USER)
    VM_IP: $(VM_IP)