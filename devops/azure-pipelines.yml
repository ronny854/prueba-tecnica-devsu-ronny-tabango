trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - devsu-demo-devops-python/**
pr:
  branches:
    include:
      - main
      - develop

variables:
  pythonVersion: '3.11'
  dockerRegistryServiceConnection: 'docker-hub-connection'
  imageRepository: 'demo-devops-python'
  containerRegistry: 'docker.io/your-username'
  dockerfilePath: '$(Build.SourcesDirectory)/devsu-demo-devops-python/Dockerfile'
  tag: '$(Build.BuildId)'
  workingDirectory: '$(Build.SourcesDirectory)/devsu-demo-devops-python'
  kubernetesServiceConnection: 'k8s-connection'
  namespace: 'demo-devops'

stages:
- template: stages/buildPythonStage.yml
  parameters:
    pythonVersion: $(pythonVersion)
    workingDirectory: $(workingDirectory)
    dockerRegistryServiceConnection: $(dockerRegistryServiceConnection)
    imageRepository: $(imageRepository)
    containerRegistry: $(containerRegistry)
    dockerfilePath: $(dockerfilePath)
    buildContext: $(workingDirectory)
    tag: $(tag)