parameters:
  - name: projectname
    type: string
    default: 'devsu-demo-devops-python'
    displayName: 'Nombre del proyecto/repo'
  - name: imageRepository
    type: string
    default: 'ronnyt854/demo-devops-python'
    displayName: 'Nombre del repositorio de imagen Docker'
trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - ${{ parameters.projectname }}/**
pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - devsu-demo-devops-python/**

variables:
  dockerRegistryServiceConnection: 'dockerRegistryServiceConnection'
  containerRegistry: 'docker.io'
  workingDirectory: '$(Build.SourcesDirectory)/${{ parameters.projectname }}'
  dockerfilePath: '$(Build.SourcesDirectory)/${{ parameters.projectname }}/Dockerfile'
  buildImage: 'ronnyt854/python311_build:v1.1'

stages:
- template: stages/buildPythonStage.yml
  parameters:
    imageRepository: '${{ parameters.imageRepository }}'
    tag: '$(Build.BuildId)'
    workingDirectory: '$(workingDirectory)'
    dockerfilePath: '$(dockerfilePath)'
    dockerBuildContext: '$(workingDirectory)'
    dockerRegistryServiceConnection: '$(dockerRegistryServiceConnection)'
    containerRegistry: '$(containerRegistry)'
    buildImage: '$(buildImage)'
    # Build/push solo en ramas (no PR). La condición exacta está en el template.
    pushImage: true